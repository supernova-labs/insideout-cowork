<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Produtos · Inside Out</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Instrument+Serif&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Inside Out PR — mesmos tokens da Biblioteca de Estilos
         (identidade visual única: kraft + petróleo + terracota) */
      --bg-primary: #f0e8d8;
      --bg-secondary: #e9dfc9;
      --bg-tertiary: #e3d8bf;
      --border: #d2c4a6;
      --text-primary: #173e3e;
      --text-secondary: #5d6f6a;
      --text-muted: #9a917c;
      --accent: #bd5a39;
      --accent-dim: #9a4528;
      --success: #1e7a6f;
      --on-accent: #fdf6e7;
      --shadow: rgba(20, 46, 46, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      background-image:
        radial-gradient(ellipse at 0% 0%, rgba(189, 90, 57, 0.05) 0%, transparent 55%),
        radial-gradient(ellipse at 100% 100%, rgba(23, 62, 62, 0.04) 0%, transparent 55%);
    }

    body::before {
      content: "";
      position: fixed;
      top: -260px;
      right: -200px;
      width: 620px;
      height: 620px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      background: repeating-conic-gradient(from 0deg at 50% 50%,
        rgba(189, 90, 57, 0) 0deg 3.2deg,
        rgba(189, 90, 57, 0.16) 3.2deg 5deg);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, #000 26%, transparent 62%);
      mask-image: radial-gradient(circle at 50% 50%, #000 0%, #000 26%, transparent 62%);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 3rem 2rem;
      position: relative;
      z-index: 1;
    }

    header { margin-bottom: 3rem; }

    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 3.5rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    h1 span { color: var(--accent); }

    .subtitle { color: var(--text-secondary); font-size: 1.1rem; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover { border-color: var(--text-muted); color: var(--text-primary); }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }

    .brand-block { margin-bottom: 3.5rem; }

    .brand-head {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-name {
      font-family: 'Instrument Serif', serif;
      font-size: 2rem;
      color: var(--text-primary);
    }

    .brand-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .brand-brief {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem 1.5rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    .brief-field { font-size: 0.9rem; line-height: 1.5; }

    .brief-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      display: block;
      margin-bottom: 0.25rem;
    }

    .brief-value { color: var(--text-secondary); }
    .brief-value ul { margin: 0.2rem 0 0 1.1rem; }
    .brief-value li { margin: 0.1rem 0; }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .product-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      transition: box-shadow 0.2s ease;
    }

    .product-card:hover { box-shadow: 0 8px 24px var(--shadow); }

    .product-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .product-name {
      font-family: 'Instrument Serif', serif;
      font-size: 1.3rem;
    }

    .product-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
    }

    .product-desc {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 0.6rem;
    }

    .product-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.6rem;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      padding: 0.25rem 0.5rem;
      background: var(--bg-tertiary);
      border-radius: 3px;
      color: var(--text-secondary);
    }

    .claims {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 0.75rem;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 0.4rem;
    }

    .photo-thumb {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .photo-thumb:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 12px var(--shadow);
    }

    .photo--none {
      grid-column: 1 / -1;
      border: 1px dashed var(--border);
      background: var(--bg-tertiary);
      border-radius: 6px;
      padding: 1rem;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .hover-preview {
      display: none;
      position: fixed;
      z-index: 500;
      pointer-events: none;
      max-width: 400px;
      max-height: 400px;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(20, 46, 46, 0.35);
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      padding: 4px;
    }

    .hover-preview.active { display: block; animation: previewFadeIn 0.15s ease; }

    .hover-preview img {
      max-width: 100%;
      max-height: 392px;
      object-fit: contain;
      border-radius: 6px;
      display: block;
    }

    @keyframes previewFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(20, 46, 46, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 80px rgba(20, 46, 46, 0.45);
      animation: lightboxFadeIn 0.2s ease;
    }

    @keyframes lightboxFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .lightbox-close {
      position: absolute;
      top: 2rem;
      right: 2rem;
      font-size: 2rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.2s ease;
      font-family: 'JetBrains Mono', monospace;
    }

    .lightbox-close:hover { color: var(--text-primary); }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }

    .empty-state h2 {
      font-family: 'Instrument Serif', serif;
      font-weight: 400;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
    }

    @media (max-width: 900px) {
      h1 { font-size: 2.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Catálogo <span>de Produtos</span></h1>
      <p class="subtitle">Produtos por marca da Inside Out — fotos, tom de voz, mensagens-chave e público. Diga ao Claude a marca e o produto para gerar uma peça.</p>
    </header>

    <div class="filters" id="brand-filters">
      <!-- Populated by JS (safe DOM) -->
    </div>

    <div id="catalog-body">
      <!-- Populated by JS (safe DOM) -->
    </div>

    <div class="empty-state" id="empty-state" style="display: none;">
      <h2>Catálogo vazio</h2>
      <p>Adicione uma marca e produtos para começar.</p>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close">&times;</span>
    <img src="" alt="Visualização ampliada" id="lightbox-img">
  </div>

  <!-- Hover Preview -->
  <div class="hover-preview" id="hover-preview">
    <img src="" alt="Prévia" id="hover-preview-img">
  </div>

  <script>
    // Catálogo: { brands: [...], products: [...] }. Injetado por
    // product_library.render_catalog (placeholder abaixo).
    const catalog = /*__CATALOG_JSON__*/null;
    const data = catalog || { brands: [], products: [] };

    // --- Construtores de DOM seguros (sem innerHTML de conteúdo dinâmico) ---
    // Todo dado dinâmico entra como TEXT NODE — zero HTML interpretado.
    function el(tag, props, children) {
      const e = document.createElement(tag);
      if (props) {
        for (const k in props) {
          const v = props[k];
          if (v == null) continue;
          if (k === 'class') e.className = v;
          else if (k === 'text') e.textContent = v;
          else if (k === 'dataset') Object.assign(e.dataset, v);
          else if (k.slice(0, 2) === 'on' && typeof v === 'function')
            e.addEventListener(k.slice(2), v);
          else e.setAttribute(k, v);
        }
      }
      if (children != null) {
        const arr = Array.isArray(children) ? children : [children];
        for (const c of arr) {
          if (c == null) continue;
          e.append(c.nodeType ? c : document.createTextNode(String(c)));
        }
      }
      return e;
    }

    const filtersEl = document.getElementById('brand-filters');
    const bodyEl = document.getElementById('catalog-body');
    const emptyState = document.getElementById('empty-state');
    let currentBrand = 'all';

    function briefField(label, valueNode) {
      return el('div', { class: 'brief-field' }, [
        el('span', { class: 'brief-label', text: label }),
        valueNode
      ]);
    }

    function brandBrief(b) {
      if (!b) return null;
      const fields = [];
      if (b.voice)
        fields.push(briefField('Tom de voz',
          el('span', { class: 'brief-value', text: b.voice })));
      if (b.keyMessages && b.keyMessages.length) {
        const ul = el('ul');
        for (const m of b.keyMessages) ul.append(el('li', { text: m }));
        fields.push(briefField('Mensagens-chave',
          el('span', { class: 'brief-value' }, ul)));
      }
      if (b.audience)
        fields.push(briefField('Público-alvo',
          el('span', { class: 'brief-value', text: b.audience })));
      if (b.paletteHints)
        fields.push(briefField('Paleta',
          el('span', { class: 'brief-value', text: b.paletteHints })));
      if (b.guardrails)
        fields.push(briefField('Guardrails',
          el('span', { class: 'brief-value', text: b.guardrails })));
      if (!fields.length) return null;
      return el('div', { class: 'brand-brief' }, fields);
    }

    function productCard(p) {
      const head = el('div', { class: 'product-head' }, [
        el('span', { class: 'product-name', text: p.name }),
        el('span', { class: 'product-id',
          text: '#' + String(p.id).padStart(2, '0') })
      ]);

      const children = [head];
      if (p.description)
        children.push(el('div', { class: 'product-desc', text: p.description }));
      if ((p.tags || []).length)
        children.push(el('div', { class: 'product-tags' },
          p.tags.map(t => el('span', { class: 'tag', text: t }))));
      if ((p.claims || []).length)
        children.push(el('div', { class: 'claims',
          text: p.claims.join(' · ') }));

      const grid = el('div', { class: 'photo-grid' });
      const photos = p.photos || [];
      if (photos.length) {
        for (const src of photos) {
          const img = el('img', {
            class: 'photo-thumb', src: src, alt: p.name,
            onerror: function () {
              this.replaceWith(el('div', { class: 'photo--none',
                text: 'sem foto' }));
            },
            onclick: function () { openLightbox(this.src); },
            onmouseenter: function (e) { showHoverPreview(this.src, e); },
            onmousemove: function (e) { moveHoverPreview(e); },
            onmouseleave: hideHoverPreview
          });
          grid.append(img);
        }
      } else {
        grid.append(el('div', { class: 'photo--none', text: 'sem fotos' }));
      }
      children.push(grid);

      return el('div', { class: 'product-card' }, children);
    }

    function render() {
      const brands = (data.brands || []).slice()
        .sort((a, b) => (a.id || 0) - (b.id || 0));
      const products = data.products || [];

      filtersEl.replaceChildren();
      bodyEl.replaceChildren();

      if (!brands.length && !products.length) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      filtersEl.append(el('button', {
        class: 'filter-btn' + (currentBrand === 'all' ? ' active' : ''),
        text: 'Todas',
        onclick: () => { currentBrand = 'all'; render(); }
      }));
      for (const b of brands) {
        filtersEl.append(el('button', {
          class: 'filter-btn' + (currentBrand === b.slug ? ' active' : ''),
          text: b.name,
          onclick: () => { currentBrand = b.slug; render(); }
        }));
      }

      const shown = currentBrand === 'all'
        ? brands : brands.filter(b => b.slug === currentBrand);

      for (const b of shown) {
        const bp = products
          .filter(p => p.brand === b.slug)
          .sort((x, y) => (x.id || 0) - (y.id || 0));

        const block = el('div', { class: 'brand-block' });
        block.append(el('div', { class: 'brand-head' }, [
          el('span', { class: 'brand-name', text: b.name }),
          el('span', { class: 'brand-count',
            text: bp.length + ' produto(s)' })
        ]));
        const brief = brandBrief(b);
        if (brief) block.append(brief);

        if (bp.length) {
          block.append(el('div', { class: 'products' },
            bp.map(productCard)));
        } else {
          block.append(el('div', { class: 'empty-state' },
            el('p', { text: 'Nenhum produto nesta marca ainda.' })));
        }
        bodyEl.append(block);
      }
    }

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.querySelector('.lightbox-close');

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }
    lightbox.addEventListener('click', closeLightbox);
    lightboxClose.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    // Hover preview
    const hoverPreview = document.getElementById('hover-preview');
    const hoverPreviewImg = document.getElementById('hover-preview-img');

    function showHoverPreview(src, e) {
      hoverPreviewImg.src = src;
      hoverPreview.classList.add('active');
      moveHoverPreview(e);
    }
    function moveHoverPreview(e) {
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      let x = e.clientX + 20;
      let y = e.clientY - 100;
      if (x + 420 > viewportWidth) x = e.clientX - 420 - 20;
      if (y < 20) y = 20;
      else if (y + 420 > viewportHeight) y = viewportHeight - 420 - 20;
      hoverPreview.style.left = x + 'px';
      hoverPreview.style.top = y + 'px';
    }
    function hideHoverPreview() {
      hoverPreview.classList.remove('active');
    }

    render();
  </script>
</body>
</html>
